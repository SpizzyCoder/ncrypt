[package]
name = "ncrypt"
version = "0.2.3"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8", "rand_core", "zeroize", "pem"] }
indicatif = "0.18.6"
rand = "0.10.2"
rpassword = "7.5.4"
snap = "1.1.2"
zeroize = "1.9.0"
