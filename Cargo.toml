[package]
name = "ncrypt"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.101"
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.8.3"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.59", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["alloc", "pkcs8", "rand_core", "zeroize", "pem"] }
indicatif = "0.18.4"
rand = "0.10.0"
rpassword = "7.4.0"
snap = "1.1.1"
zeroize = "1.8.2"
